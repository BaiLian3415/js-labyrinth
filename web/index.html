<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JsLabyrinth — JS 混淆器</title>
<meta name="description" content="JsLabyrinth 混淆器网页版：混淆在浏览器内完成，代码不出本机。">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta property="og:type" content="website">
<meta property="og:title" content="JsLabyrinth — JS 混淆器">
<meta property="og:description" content="浏览器内运行的 JavaScript 混淆器，代码不出本机，不需要把源码上传到任何服务器。">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">

<!-- 首屏防闪：在样式表之前把已存的深浅色与语言贴到 <html> 上。
     放在 app.js 里做会晚一帧，浅色用户每次加载都先闪一下深色底。 -->
<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('jslabyrinth.gui.v1') || 'null');
    if (!s || typeof s !== 'object') return;
    if (s.theme === 'light') document.documentElement.className = 'light';
    if (s.lang === 'en') document.documentElement.lang = 'en';
  } catch (e) { /* 存档损坏就按默认值渲染，不阻断页面 */ }
})();
</script>

<link rel="stylesheet" href="./styles.css">
<!--JSLB_PRELOAD-->
</head>
<body>

<noscript>
  <p class="noscript">JsLabyrinth 的界面需要 JavaScript 才能运行。命令行用法见项目 README。</p>
</noscript>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">🌀</span>
    <h1 data-i18n="guiTitle">JsLabyrinth 混淆器</h1>
    <span class="ver" id="ver"></span>
  </div>

  <div class="presets" id="presets" role="radiogroup" data-i18n-aria="guiAriaPresets" aria-label="preset"></div>

  <div class="topbar-right">
    <span class="badge" id="apiState" hidden></span>
    <span class="badge" id="licBadge"></span>
    <select id="lang" class="mini" data-i18n-aria="guiAriaLang" aria-label="language">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
    <button id="themeBtn" class="mini" type="button" data-i18n-title="guiAriaTheme" data-i18n-aria="guiAriaTheme" title="theme">
      <span data-i18n="guiThemeDark">深色</span>
    </button>
    <button id="optsBtn" class="mini" type="button" aria-expanded="true" aria-controls="drawer"
      data-i18n-aria="guiAriaOptions" data-i18n-title="guiAriaOptions">
      <span data-i18n="guiOptions">选项</span> ▾
    </button>
  </div>
</header>

<main class="panes">
  <section class="pane" id="inputPane">
    <div class="pane-head">
      <h2 data-i18n="guiInput">输入</h2>
      <div class="pane-tools">
        <select id="mode" class="mini" data-i18n-aria="guiAriaMode" aria-label="mode">
          <option value="auto" data-i18n="guiModeAuto">自动识别</option>
          <option value="js" data-i18n="guiModeJs">JavaScript</option>
          <option value="html" data-i18n="guiModeHtml">HTML 内联脚本</option>
        </select>
        <button id="openBtn" class="mini" type="button" data-i18n="guiOpenFiles">打开文件</button>
        <button id="clearBtn" class="mini" type="button" data-i18n="guiClear">清空</button>
        <input id="fileInput" type="file" multiple accept=".js,.mjs,.cjs,.html,.htm,.xhtml,.txt" hidden>
      </div>
    </div>
    <div class="files" id="files" hidden></div>
    <textarea id="input" class="editor" spellcheck="false" autocomplete="off"
      data-i18n-aria="guiInput" aria-label="input"
      placeholder="// 在此粘贴 JavaScript，或把 .js / .html 文件拖进这个面板"></textarea>
    <div class="pane-foot">
      <span id="inInfo" class="dim"></span>
      <span id="dropHint" class="dim" data-i18n="guiDropHint">拖入 .js / .html 文件，或直接粘贴代码到左侧</span>
    </div>
  </section>

  <section class="pane" id="outputPane">
    <div class="pane-head">
      <h2 data-i18n="guiOutput">输出</h2>
      <div class="pane-tools">
        <button id="runBtn" class="primary" type="button" data-i18n="guiRun">开始混淆</button>
        <button id="copyBtn" class="mini" type="button" data-i18n="guiCopy">复制</button>
        <button id="dlBtn" class="mini" type="button" data-i18n="guiDownload">下载</button>
        <button id="zipBtn" class="mini" type="button" hidden data-i18n="guiDownloadZip">打包下载</button>
      </div>
    </div>
    <textarea id="output" class="editor" spellcheck="false" readonly
      data-i18n-aria="guiAriaOutput" aria-label="output"
      placeholder="// 混淆结果"></textarea>
    <div class="pane-foot">
      <span id="outInfo" class="dim"></span>
      <span id="outSize" class="dim"></span>
    </div>
    <details id="statsBox" class="stats" hidden>
      <summary data-i18n="guiStats">混淆统计</summary>
      <div id="statsBody" class="stats-body"></div>
    </details>
  </section>
</main>

<section class="drawer" id="drawer">
  <div class="drawer-cols">
    <div class="drawer-col">
      <h3 data-i18n="guiLicense">授权</h3>
      <div class="lic-box">
        <div id="licInfo" class="dim"></div>
        <label class="row field">
          <span data-i18n="guiApiEndpoint">服务地址</span>
          <input id="apiBase" class="text" type="text" placeholder="/" spellcheck="false">
        </label>
        <label class="row field">
          <span data-i18n="guiLicenseKey">卡密</span>
          <input id="licKey" class="text" type="text" autocomplete="off" spellcheck="false" placeholder="JSLB-...">
        </label>
        <div class="row btns">
          <button id="actBtn" class="mini" type="button" data-i18n="guiActivate">激活</button>
          <button id="deactBtn" class="mini" type="button" data-i18n="guiDeactivate">解除激活</button>
        </div>
        <div id="licDevice" class="dim mono"></div>
      </div>
      <p class="hint" id="apiHint"></p>

      <h3 data-i18n="guiSeedTitle">随机种子</h3>
      <label class="row field">
        <input id="seed" class="text" type="text" inputmode="numeric" placeholder="—" spellcheck="false">
      </label>
      <p class="hint" data-i18n="guiSeed">随机种子（留空即每次不同）</p>
    </div>

    <div class="drawer-col wide" id="optCols"></div>
  </div>
  <div class="drawer-foot">
    <span class="hint" id="presetHint" data-i18n="guiPresetHint">预设只提供默认值，下面的显式选项逐字段覆盖它。</span>
    <button id="resetBtn" class="mini" type="button" data-i18n="guiReset">恢复默认选项</button>
  </div>
</section>

<footer class="statusbar">
  <span id="status" class="status" role="status" aria-live="polite"></span>
  <span id="shortcutHint" class="hint"></span>
  <span id="quota" class="dim right"></span>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
