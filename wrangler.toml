# Cloudflare Workers 部署配置。
#
#   npm run build:web      先把界面与核心装进 dist/（无外部依赖，纯 Node 脚本）
#   npx wrangler dev       本地起服务（等价于线上环境：workerd + 静态资源 + API）
#   npx wrangler deploy    发布
#
# 也可以直接把 dist/ 当 Pages 项目发布（静态界面 + functions/ 里的 API）：
#   npx wrangler pages deploy dist
#
# 说明：核心与入口都不 import 任何 node: 内建模块，因此不需要 nodejs_compat 兼容标志。

name = "jslabyrinth"
main = "worker/index.js"
compatibility_date = "2025-04-01"

# 静态界面。dist/ 由 tools/build/build-web.js 生成（web/ 的界面 + src/ 的核心）。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# /api/* 一律先交给 Worker，再考虑静态资源。
#
# 必须显式写出来：compatibility_date 在 2025-04-01 及以后时，导航请求（浏览器
# 地址栏直接打开，带 Sec-Fetch-Mode: navigate）会优先走静态资源，而 dist/ 里
# 没有 /api/* 这个文件，于是 /api/health 在浏览器里打开会得到 404 页面而不是
# JSON。界面里的 fetch 属于 cors 请求，本来就会命中 Worker，所以不加这一行
# 前端也能跑——但直接访问接口会莫名其妙地 404。写上之后两条路径一致。
# 核心算法的入口与目录也要先过 Worker：按设备鉴权下发，见下面的 JSLB_GATE_CORE。
# 只列入口与目录，不逐个列文件——其余模块要公开，界面靠它们渲染激活表单。
# 注意 /src/utils/* 也在这里，但 worker 侧对 hash.js 与 zip.js 有豁免（激活表单要用），
# 豁免名单在 worker/gate-policy.js 的 GATED_EXEMPT。
#
# /src/__jslb_core.js 与 /src/__core.pack 是模块体加密层（构建期生成）：引导层含密钥、
# 载荷是密文，两者都必须挡。它们不在 src/ 源码树里，所以构建期不会被混淆/加密。
#
# 这份列表必须与 worker/gate-policy.js 的 GATED_PREFIXES 一致——两处漂移不会报错，
# 只在线上表现为"未激活界面空白"或"加密层形同虚设"。改一处记得改另一处。
run_worker_first = ["/api/*", "/src/index.js", "/src/obfuscate.js", "/src/pipeline.js",
                    "/src/html.js", "/src/passes/*", "/src/ast/*", "/src/utils/*",
                    "/src/__jslb_core.js", "/src/__core.pack"]

[vars]
# 网页版策略，JSON 文本。这里显式要求激活卡密：未激活一律拒绝。
# 界面会从 /api/plans 读回这份策略，两端判断保持一致。
# trialRunsPerDay 给有限值：试用完全不限次数等于把它当成免费正式版。
#
# 注意：requireLicense 为 true 时，试用态根本不会创建（license-web.ensure() 在这一步
# 直接返回 missing），所以下面三个 trial* 全是**死配置**，改了也看不到效果。它们留着
# 是为了将来放开试用时直接生效。要让它们真正起作用，得把 requireLicense 改成 false
# （服务端 API 也一起放开），或者改界面只同步 trial*、不同步 requireLicense。
JSLB_WEB_CONFIG = '{"requireLicense":true,"trialPreset":"low","trialMaxFileBytes":524288,"trialRunsPerDay":10}'

# 核心源码是否只对已激活设备开放。
#
# 界面是原生 ESM，src/** 整棵模块树必须能被浏览器取到，于是默认任何人都能顺着
# index.html 的 modulepreload 清单把实现整个爬走。开启后：未激活设备请求
# /src/* 与 /app.js 一律 403，只能拿到页面外壳；已激活设备靠 HttpOnly 的设备
# cookie 通过（浏览器的模块请求带不了自定义头，身份只能走 cookie）。
#
# 只对 Workers 生效——Pages 的静态资源不经过 Worker 的 fetch。
# 代价：每个模块请求一次 KV 读，一次页面加载约五十次。
#
# 界面已经改成分段加载：授权链路静态引入（options-meta / options-gate / plan /
# license-web / i18n / platform / options / presets / version / utils-zip），
# 混淆核心在激活后 `await import('./src/index.js')`。所以死锁解除，可以开。
#
# 只对 Workers 生效——Pages 的静态资源不经过 Worker 的 fetch。
# 代价：每个模块请求一次 KV 读，一次页面加载约三十次（免费版十万次读/天）。
JSLB_GATE_CORE = "true"

# 跨域来源。同源部署（界面与 API 同一个域名）时用不到；纯 API 供他人调用时再收紧。
# JSLB_CORS_ORIGIN = "https://your.site"

# 卡密是 v5 对称格式（编号 + 加密信息段 + 校验码），验证密钥内置在
# src/license-secret.js（B64_CODE_KEY）。对称密钥随静态资源公开——拿到源码的人
# 能自己造卡，真正的强制靠服务端校验 + KV 赎回登记 + JSLB_GATE_CORE。
#
# 只有"用自己的密钥发卡"时才需要覆盖（可选）：
#   npx wrangler secret put JSLB_CODE_KEY        # 值为 tools/issue/keyrotate.js 生成的新密钥
#   npx wrangler secret put JSLB_MACHINE_SALT    # 值为 src/license-secret.js 的 B64_MACHINE_SALT

# KV：许可证记录与试用计数跨请求持久化。
#
# 键会按设备码自动加后缀（见 src/license-web.js 的 scopedKey），所以整站不会
# 共用一条许可证记录。未绑定时 Worker 完全无状态：许可证与计数逐请求即弃，
# 客户端每次请求都要带上卡密。
[[kv_namespaces]]
binding = "JSLB_KV"
id = "cfdd5c6983dd427aa03ba995c45bbd91"

# 大文件用付费版的更长 CPU 预算；免费版单请求 10 ms，只够很小的输入。
# [limits]
# cpu_ms = 30000
